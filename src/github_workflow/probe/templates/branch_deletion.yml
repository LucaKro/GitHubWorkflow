# Pushed by the cloud probe to test deleting branches from a workflow: deletes the probe's
# other branch, then the branch carrying this file. The probe fills in both names.
name: Probe branch deletion

on:
  push:
    branches: ["__WORKFLOW_BRANCH__"]

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the probe's branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in "__DELETED_BRANCH__" "__WORKFLOW_BRANCH__"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
