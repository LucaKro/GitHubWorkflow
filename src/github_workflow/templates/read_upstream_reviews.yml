# Reads the reviews of the pull requests opened upstream that the requests waiting in
# __REQUESTS_DIRECTORY__ on this notes branch name, whenever they change, and saves
# GitHub's answers in __ANSWERS_DIRECTORY__ for the session to read them from. Written by
# `python -m github_workflow review list`, since a cloud session cannot reach the
# upstream repository itself; nothing is written upstream.
name: Read upstream reviews
on:
  push:
    branches: [__NOTES_BRANCH__]
    paths: ["__REQUESTS_DIRECTORY__/**"]
permissions:
  contents: write
concurrency:
  group: read-upstream-reviews
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the workflow
        run: python -m pip install --quiet __REQUIREMENTS__
      - name: Read the reviews and save the answers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          __ENTRY_POINT__ "__REQUESTS_DIRECTORY__" "__ANSWERS_DIRECTORY__"
          bash "__COMMIT_SCRIPT__" "Answer the upstream review requests" "${GITHUB_REF_NAME}" "__REQUESTS_DIRECTORY__" "__ANSWERS_DIRECTORY__"
