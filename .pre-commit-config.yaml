repos:
  - repo: local
    hooks:
      - id: format-python
        name: Format Python (black, then docformatter where it doesn't conflict with black)
        description: >
          Runs black, then docformatter on top of it, keeping docformatter's
          docstring changes only when a subsequent black pass leaves them
          unchanged.
        entry: python domain_model/scripts/format_docstrings.py
        language: python
        additional_dependencies: ["black==25.11.0", "docformatter==1.7.8"]
        files: \.py$
      - id: draw-domain-model-architecture
        name: Draw the domain model's architecture diagrams into its README
        entry: env PYTHONPATH=domain_model/src python domain_model/scripts/draw_architecture.py
        language: python
        pass_filenames: false
        files: ^domain_model/(src/.*\.py|README\.md)$
      - id: draw-workflow-architecture
        name: Draw the workflow's architecture diagrams into its README
        entry: env PYTHONPATH=domain_model/src:src python -m github_workflow.architecture
        language: python
        pass_filenames: false
        files: ^(src/.*\.py|domain_model/src/domain_model/architecture/.*\.py|README\.md)$
