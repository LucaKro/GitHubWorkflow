repos:
  - repo: local
    hooks:
      - id: format-python
        name: Format Python (black, then docformatter where it doesn't conflict with black)
        description: >
          Runs black, then docformatter on top of it, keeping docformatter's
          docstring changes only when a subsequent black pass leaves them
          unchanged.
        entry: python domain_model/scripts/format_docstrings.py
        language: python
        additional_dependencies: ["black==25.11.0", "docformatter==1.7.8"]
        files: \.py$
      - id: draw-architecture
        name: Draw the architecture diagrams into both READMEs
        entry: env PYTHONPATH=domain_model/src:src python -m github_workflow.architecture . domain_model
        language: python
        pass_filenames: false
        files: (\.py|README\.md|pyproject\.toml)$
