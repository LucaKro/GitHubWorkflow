# Completes a finding label picked on GitHub: a stage, priority or evidence label
# replaces the others of its kind, a priority on a plain issue makes it an unreviewed
# finding, and "finding: incorrect" closes the issue as not planned. Written by
# `python -m github_workflow finding automate`.
name: Complete finding labels
on:
  issues:
    types: [labeled]
permissions:
  issues: write
concurrency:
  group: complete-finding-labels-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the workflow
        run: python -m pip install --quiet 'basstler-domain-model @ git+https://github.com/LucaKro/basstler_domain_model@4dd8c9af90e51d07167e30e7c98e6d933736caa4' 'github-workflow @ git+https://github.com/LucaKro/GitHubWorkflow@main'
      - name: Complete the label
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m github_workflow.label_events "${GITHUB_EVENT_PATH}"
