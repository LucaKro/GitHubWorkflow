# Deletes the branches listed in ready-for-deletion.md on this notes branch that are still at the
# commit listed with them, whenever it is pushed, then empties the list. Written by
# `python -m github_workflow cleanup` where the session itself may not delete branches.
# Never deletes the default branch or this notes branch.
name: Delete branches ready for deletion
on:
  push:
    branches: [github-workflow/notes]
permissions:
  contents: write
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete the listed branches still at their listed commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: bash ".github/scripts/delete-ready-branches.sh" "ready-for-deletion.md" "${DEFAULT_BRANCH}" "${GITHUB_REF_NAME}"
